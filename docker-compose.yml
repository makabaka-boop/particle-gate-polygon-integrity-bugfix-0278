services:
  gates:
    build: ./gates
    image: particle-gates
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  viewer:
    build: ./viewer
    image: particle-viewer
    ports:
      - "8080:8080"
    depends_on:
      gates:
        condition: service_healthy
